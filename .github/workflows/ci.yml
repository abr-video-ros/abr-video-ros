name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, jazzy ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  ROS_DISTRO: jazzy

jobs:
  # ============================================================================
  # BASIC CHECKS
  # ============================================================================
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install \
            ament_flake8 \
            ament_pep257 \
            ament_copyright \
            ament_xmllint \
            ament_lint_cmake \
            cpplint

      - name: Check C++ formatting
        run: |
          # Check if clang-format would make changes
          find . -name "*.cpp" -o -name "*.hpp" -o -name "*.h" | \
          xargs clang-format --dry-run --Werror || echo "C++ formatting issues found"

      - name: Run copyright check
        run: ament_copyright --exclude build install log .git

      - name: Run XML linting
        run: ament_xmllint --exclude build install log .git

      - name: Run CMake linting
        run: ament_lint_cmake --exclude build install log .git

  # ============================================================================
  # BUILD AND TEST MATRIX
  # ============================================================================
  build-and-test:
    name: Build & Test (ROS ${{ matrix.ros_distro }})
    runs-on: ubuntu-22.04
    needs: code-quality
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [jazzy]
        include:
          - ros_distro: jazzy
            ubuntu_version: ubuntu-22.04
            container: osrf/ros:jazzy-desktop-full
    
    container:
      image: ${{ matrix.container }}
      options: --user root

    steps:
      - name: Setup workspace
        run: |
          apt-get update && apt-get install -y \
            wget \
            curl \
            gnupg2 \
            lsb-release \
            ca-certificates

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: src/abr-video-ros

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
            python3-colcon-common-extensions \
            python3-colcon-mixin \
            python3-rosdep \
            python3-vcstool \
            build-essential \
            cmake \
            git \
            libeigen3-dev \
            libgeographic-dev \
            pkg-config \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libx264-dev \
            libx265-dev \
            libvpx-dev \
            libfdk-aac-dev \
            libmp3lame-dev \
            libopus-dev \
            yasm \
            wget

      - name: Install ROS dependencies
        run: |
          rosdep init || echo "rosdep already initialized"
          rosdep update --rosdistro ${{ matrix.ros_distro }}
          rosdep install --from-paths src --ignore-src -r -y --rosdistro ${{ matrix.ros_distro }}

      - name: Setup colcon mixins
        run: |
          colcon mixin add default https://raw.githubusercontent.com/colcon/colcon-mixin-repository/master/index.yaml || true
          colcon mixin update default || true

      - name: Build workspace
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          colcon build \
            --cmake-args \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic" \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            --ament-cmake-args \
              -DCMAKE_BUILD_TYPE=Release \
            --event-handlers console_direct+ \
            --parallel-workers $(nproc)

      - name: Run tests
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          source install/setup.bash
          colcon test \
            --event-handlers console_direct+ \
            --return-code-on-test-failure \
            --parallel-workers $(nproc)

      - name: Get test results
        if: always()
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          colcon test-result --verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.ros_distro }}
          path: |
            log/
            build/*/test_results/
            build/*/Testing/
          retention-days: 30

  # ============================================================================
  # INTEGRATION TESTS
  # ============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-22.04
    needs: build-and-test
    container:
      image: osrf/ros:jazzy-desktop-full
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: src/abr-video-ros

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y \
            python3-colcon-common-extensions \
            python3-rosdep \
            libavcodec-dev \
            libavutil-dev \
            libswscale-dev \
            libx264-dev \
            libx265-dev \
            ros-jazzy-cv-bridge \
            ros-jazzy-image-transport \
            ros-jazzy-rqt-image-view \
            ros-jazzy-v4l2-camera \
            python3-opencv \
            python3-numpy

      - name: Initialize rosdep
        run: |
          rosdep init || echo "rosdep already initialized"
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src --ignore-src -r -y --rosdistro jazzy

      - name: Build workspace
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: Test package discovery
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          echo "=== Testing package discovery ==="
          ros2 pkg list | grep abr_image_transport

      - name: Test transport plugin
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          echo "=== Testing transport plugin ==="
          timeout 30s ros2 run image_transport list_transports || echo "Transport test completed with timeout"

      - name: Test service interfaces
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          echo "=== Testing service interfaces ==="
          ros2 interface list | grep abr_image_transport_interfaces

      - name: Test codec functionality
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          echo "=== Testing codec functionality ==="
          # Test that FFmpeg codecs are available
          python3 -c "
          import subprocess
          result = subprocess.run(['ffmpeg', '-codecs'], capture_output=True, text=True)
          if 'libx264' in result.stdout:
              print('✓ H.264 codec available')
          else:
              print('✗ H.264 codec not found')
              exit(1)
          "

  # ============================================================================
  # PERFORMANCE TESTS (Optional - only on main branch)
  # ============================================================================
  performance-tests:
    name: Performance Benchmarks
    runs-on: ubuntu-22.04
    needs: integration-tests
    if: github.ref == 'refs/heads/main'
    container:
      image: osrf/ros:jazzy-desktop-full
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: src/abr-video-ros

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y \
            python3-colcon-common-extensions \
            python3-rosdep \
            libavcodec-dev \
            libavutil-dev \
            libswscale-dev \
            libx264-dev \
            time \
            htop \
            stress-ng

      - name: Build workspace
        run: |
          source /opt/ros/jazzy/setup.bash
          rosdep init || echo "rosdep already initialized"
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src --ignore-src -r -y --rosdistro jazzy
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: Run performance tests
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          echo "=== Performance Test Results ==="
          echo "CPU Info:"
          cat /proc/cpuinfo | grep "model name" | head -1
          echo "Memory Info:"
          free -h
          echo "=== Build completed successfully ==="

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: |
            log/
            build/*/benchmark_results/
          retention-days: 90

  # ============================================================================
  # DOCUMENTATION BUILD
  # ============================================================================
  documentation:
    name: Build Documentation
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install documentation tools
        run: |
          pip install \
            sphinx \
            sphinx-rtd-theme \
            breathe \
            exhale \
            myst-parser

      - name: Check README
        run: |
          echo "=== README.md validation ==="
          # Check that README exists and has required sections
          if [ -f "README.md" ]; then
            echo "✓ README.md exists"
            grep -q "Quick Start" README.md && echo "✓ Quick Start section found"
            grep -q "Installation" README.md && echo "✓ Installation section found"
            grep -q "Usage" README.md && echo "✓ Usage section found"
          else
            echo "✗ README.md not found"
            exit 1
          fi

      - name: Check CONTRIBUTING
        run: |
          echo "=== CONTRIBUTING.md validation ==="
          if [ -f "CONTRIBUTING.md" ]; then
            echo "✓ CONTRIBUTING.md exists"
          else
            echo "✗ CONTRIBUTING.md not found"
            exit 1
          fi

  # ============================================================================
  # SECURITY SCAN
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run security scan
        uses: github/super-linter@v4
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_CPP: true
          VALIDATE_CMAKE: true
          VALIDATE_XML: true
          VALIDATE_YAML: true
          VALIDATE_PYTHON: true
          LINTER_RULES_PATH: /
          SUPPRESS_POSSUM: true

  # ============================================================================
  # FINAL STATUS CHECK
  # ============================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-22.04
    needs: [code-quality, build-and-test, integration-tests]
    if: always()
    steps:
      - name: Check CI results
        run: |
          echo "=== CI Pipeline Results ==="
          echo "Code Quality: ${{ needs.code-quality.result }}"
          echo "Build & Test: ${{ needs.build-and-test.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          
          if [[ "${{ needs.code-quality.result }}" == "success" && \
                "${{ needs.build-and-test.result }}" == "success" && \
                "${{ needs.integration-tests.result }}" == "success" ]]; then
            echo "🎉 All CI checks passed!"
            exit 0
          else
            echo "❌ Some CI checks failed"
            exit 1
          fi